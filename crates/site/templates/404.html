{% extends "base.html" %}
{% block content %}
<div class="container">
  <section class="section not-found">
    <p class="not-found-code" aria-hidden="true">404</p>
    <div class="game-target" data-gpu="target" aria-hidden="true"></div>
    <h1 class="section-title" data-gpu="title">{{ layout.t.not_found.title }}</h1>
    <p class="page-intro" data-gpu="scrim">{{ layout.t.not_found.text }}</p>
    <p class="game-hint" data-gpu="scrim">
      {{ layout.t.not_found.hint }}
      <strong id="game-progress" class="game-progress" aria-live="polite">0 %</strong>
    </p>
    <p class="game-won" data-gpu="scrim" aria-live="polite">{{ layout.t.not_found.won }}</p>
    <div class="hero-actions">
      <a href="{{ layout.href("/") }}" class="btn">{{ layout.t.not_found.home }}</a>
    </div>
  </section>
</div>
{% endblock %}
