[package]
name = "gpu"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wgpu = { version = "30", default-features = false, features = ["webgpu", "wgsl"] }

[dependencies.web-sys]
version = "0.3"
features = [
  "CanvasRenderingContext2d",
  "console",
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "DomTokenList",
  "Element",
  "EventTarget",
  "FontFaceSet",
  "HtmlCanvasElement",
  "HtmlElement",
  "ImageData",
  "MediaQueryList",
  "NodeList",
  "PointerEvent",
  "Storage",
  "Window",
]
