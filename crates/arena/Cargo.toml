[package]
name = "arena"
version = "0.1.0"
edition.workspace = true

# cdylib : module WASM de la page /jeu ; rlib : `cargo test` natif de la simulation.
[lib]
crate-type = ["cdylib", "rlib"]

# Rendu et page : seulement pour le WASM, la simulation reste testable en natif sans eux.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bytemuck = { version = "1", features = ["derive"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# webgl : repli WebGL2 quand le navigateur n'a pas WebGPU (Linux, Android…).
wgpu = { version = "30", default-features = false, features = ["webgpu", "webgl", "wgsl"] }

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Document",
  "DomTokenList",
  "Element",
  "Event",
  "EventTarget",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlSelectElement",
  "NodeList",
  "Window",
]
