{% extends "base.html" %}
{% block content %}
<div class="container">
  <section class="section">
    <h1 class="section-title" data-gpu="title"><img src="/assets/blog_icon.svg" alt="" />{{ layout.t.blog.title }}</h1>
    <p class="card-text page-intro" data-gpu="scrim">{{ layout.t.blog.description }}</p>
    <div class="card-grid">
      {% for item in items %}
      <a href="{{ item.link }}" class="card-link" target="_blank" rel="noopener noreferrer">
        <article data-gpu="card" class="card card-full">
          {% if let Some(thumbnail) = item.thumbnail %}
          <img src="{{ thumbnail }}" alt="" class="card-img card-img-short" loading="lazy" />
          {% endif %}
          <div class="card-body">
            <span class="tag watch-source">{{ item.source }}</span>
            <h3 class="card-title watch-title">{{ item.title }}</h3>
            <p class="card-text watch-text">{{ item.description }}</p>
            <span class="card-meta">{{ item.date }}</span>
          </div>
        </article>
      </a>
      {% endfor %}
    </div>
  </section>
</div>
{% endblock %}
