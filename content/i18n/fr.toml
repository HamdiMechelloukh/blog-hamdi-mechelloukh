[about]
title = "Data Engineer & Backend Developer à Lille"
who_title = "Qui suis-je ?"
who_text = "Bonjour ! Je suis Hamdi Mechelloukh, Data Engineer chez Decathlon Digital à Lille. J'ai commencé ma carrière dans le développement backend avant de me spécialiser dans la data engineering. Je conçois et maintiens des pipelines de données à grande échelle avec Spark, AWS et Databricks."
journey_title = "Mon parcours"
journey_text = "Après une reconversion via l'AFPA, j'ai évolué du développement Node.js/Java vers la data engineering, en passant par des missions chez Boulanger et PROMOD en prestation de services. Depuis 2022, je suis chez Decathlon Digital où j'ai assuré la stabilité des données de performance économique avant de rejoindre l'équipe des données de prix."
craft_title = "Concevoir et faire tenir des pipelines"
craft_p1 = "Je conçois et maintiens des pipelines de données en production. Le quotidien se joue sur trois contraintes qui se contredisent souvent : le volume à traiter, la qualité de ce qui arrive, et le temps de réponse attendu en aval."
craft_p2 = "Sur la performance, l'essentiel se décide au stockage plutôt que dans le code de transformation. Un partitionnement calqué sur la façon dont le métier interroge la donnée, et non sur sa structure technique, évite de balayer des téraoctets pour répondre à une question qui ne porte que sur une journée. Quand le partitionnement ne suffit pas, j'ajoute une indexation : du Z-ordering sur les colonnes réellement filtrées, et de plus en plus du liquid clustering, qui évite de devoir repartitionner une table quand les usages changent. Le choix entre les deux n'est pas théorique, il dépend de la cardinalité des colonnes, de la fréquence d'écriture et de la stabilité des requêtes."
quality_title = "Qualité des données et contrats"
quality_p1 = "La qualité est rarement un problème de validation technique, c'est un problème de sémantique et d'engagement. Le cas qui occupe le plus mon travail : les périodes de validité des prix issues d'un ERP. Un prix n'est pas une valeur, c'est une valeur assortie d'un intervalle de temps, et les systèmes sources ne garantissent ni l'absence de trous ni l'absence de chevauchements. Reconstruire des historiques cohérents, détecter les ruptures et trancher les cas ambigus représente une part importante de la conception, bien avant toute optimisation."
quality_p2 = "C'est pour cette raison que je rédige et maintiens des data contracts. Un contrat déplace la discussion : au lieu de corriger en aval ce qu'une équipe source envoie mal, on écrit ce qui est attendu — schéma, fraîcheur, règles de validité, responsabilités — et les écarts deviennent mesurables plutôt que discutables."
reliability_title = "Exploitation, incidents et documentation"
reliability_p1 = "J'ai passé deux ans et demi responsable de la production des données avant de revenir à la conception, et je n'ai pas tout à fait quitté cette casquette. Je continue de rédiger et d'animer les postmortems, parce que c'est là que les incidents deviennent des corrections durables plutôt que des souvenirs."
reliability_p2 = "Cette expérience a changé ma façon de concevoir. Quand j'écris un pipeline aujourd'hui, je pense d'abord à ce qui se passera quand il tombera un dimanche soir : comment on le détecte, comment on le reprend, et qui saura le faire sans moi. L'observabilité et la documentation d'exploitation ne sont pas des finitions, elles font partie de la conception."
