{% extends "base.html" %}
{% block content %}
<div class="container">
  <section class="section">
    <h1 class="section-title" data-gpu="title">{{ crate::icons::CONTACT|safe }}{{ layout.t.contact.title }}</h1>
    <p class="card-text page-intro" data-gpu="scrim">{{ layout.t.contact.description }}</p>
    <form data-gpu="panel" class="contact-form" action="{{ crate::FORMSPREE_URL }}" method="POST">
      <div class="form-group">
        <label for="name">{{ layout.t.contact.name }}</label>
        <input type="text" id="name" name="name" class="form-control" required />
      </div>
      <div class="form-group">
        <label for="email">{{ layout.t.contact.email }}</label>
        <input type="email" id="email" name="email" class="form-control" required />
      </div>
      <div class="form-group">
        <label for="message">{{ layout.t.contact.message }}</label>
        <textarea id="message" name="message" rows="5" class="form-control" required></textarea>
      </div>
      <button type="submit" class="btn btn-block">{{ layout.t.contact.send }}</button>
    </form>
  </section>
</div>
{% endblock %}
