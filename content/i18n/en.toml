[about]
title = "Data & Backend Engineer in Lille, France"
who_title = "Who am I?"
who_text = "Hi! I'm Hamdi Mechelloukh, Data Engineer at Decathlon Digital in Lille. I started my career in backend development before specializing in data engineering. I design and maintain large-scale data pipelines using Spark, AWS and Databricks."
journey_title = "My journey"
journey_text = "After retraining through AFPA, I moved from Node.js/Java development to data engineering, working at Boulanger and PROMOD as a contractor. Since 2022, I've been at Decathlon Digital where I ensured the stability of economic performance data before joining the pricing data team."
craft_title = "Designing pipelines and keeping them standing"
craft_p1 = "I design and maintain data pipelines in production. The day-to-day comes down to three constraints that usually pull against each other: the volume to process, the quality of what arrives, and the response time expected downstream."
craft_p2 = "On performance, most of the outcome is decided in storage rather than in transformation code. Partitioning that mirrors how the business queries the data, rather than its technical structure, avoids scanning terabytes to answer a question about a single day. When partitioning is not enough, I add indexing: Z-ordering on the columns actually filtered on, and increasingly liquid clustering, which removes the need to repartition a table when usage patterns shift. Choosing between them is not theoretical — it depends on column cardinality, write frequency and how stable the queries are."
quality_title = "Data quality and contracts"
quality_p1 = "Data quality is rarely a technical validation problem; it is a problem of semantics and commitment. The case that takes up most of my work: price validity periods coming out of an ERP. A price is not a value, it is a value paired with a time interval, and source systems guarantee neither the absence of gaps nor the absence of overlaps. Rebuilding coherent histories, detecting breaks and deciding what to do with ambiguous cases is a large part of the design work, long before any optimisation."
quality_p2 = "That is why I write and maintain data contracts. A contract moves the conversation: instead of patching downstream what a source team sends badly, you write down what is expected — schema, freshness, validity rules, responsibilities — and gaps become measurable rather than debatable."
reliability_title = "Operations, incidents and documentation"
reliability_p1 = "I spent two and a half years running data production before returning to engineering, and I have not entirely dropped that hat. I still write and facilitate postmortems, because that is where incidents turn into lasting fixes rather than war stories."
reliability_p2 = "That experience changed how I design. When I write a pipeline now, I think first about what happens when it breaks on a Sunday evening: how it gets detected, how it gets recovered, and who will be able to do it without me. Observability and runbooks are not finishing touches, they are part of the design."
